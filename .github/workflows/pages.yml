# Deploy a size-capped site. GitHub Pages hard-limits artifacts at 1GB;
# publishing all of webxr (~8GB tracked) always fails.
name: Deploy Pages (slim)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble slim site
        shell: bash
        run: |
          set -euo pipefail
          DEST=_site
          rm -rf "$DEST"
          mkdir -p "$DEST"

          # Root marketing site + small non-webxr apps
          for f in index.html style.css script.js favicon.ico CNAME .nojekyll .htaccess; do
            [[ -f "$f" ]] && cp -a "$f" "$DEST/"
          done
          for d in .well-known demo agenda AuthTest GsheetTest insights Nutri valu-pwa 4pong itium; do
            [[ -d "$d" ]] && rsync -a --exclude node_modules --exclude .git "$d" "$DEST/"
          done

          # webxr: allowlist only. 1GB Pages cap — keep product titles, pause demos.
          # Offline (still in git): RTSVR5, BattleVR, DodgeVR*, capVR, BoltVR,
          # MotionGuidanceVR5, DriveVR*, VRscifiHallway, ChaseVR, GTAVR,
          # whiteRoomVR, brutalist*, VRrunner, body-rigged*, shared webxr/audio.
          mkdir -p "$DEST/webxr"
          [[ -f webxr/index.html ]] && cp -a webxr/index.html "$DEST/webxr/" || true

          ALLOW=(
            languageVR
            BattleVR2
            RTSVR6
            StacksVR
            VRdrift
          )

          # Shared fat cuts for RTS-family trees (PCVR A/B, proofs, HQ JPEG dupes).
          HEAVY_EXCLUDES=(
            --exclude 'scripts/'
            --exclude 'verify-*/'
            --exclude 'proof-*/'
            --exclude '_quest-work/'
            --exclude 'bench-out/'
            --exclude 'assets/terrain/scifi-overview-lods.glb'
            --exclude 'assets/terrain/scifi-overview-lods-quest.glb'
            --exclude 'assets/terrain/scifi-overview-rocks.glb'
            --exclude 'assets/terrain/scifi-rts-kit-lod0.glb'
            --exclude 'assets/terrain/scifi-rts-kit-lod2.glb'
            --exclude 'assets/terrain/scifi-rts-overview.glb'
            --exclude 'assets/terrain/terrain-skirmish-1v1-pcvr.glb'
            --exclude 'assets/terrain/*Copy*'
            --exclude 'assets/terrain/*.bak'
            --exclude 'assets/textures/**/*.exr'
            --exclude 'assets/mesa/hera-planum/detail/'
            --exclude 'assets/mesa/hera-planum/diffuse-hq.jpg'
            --exclude 'assets/mesa/hera-planum/normal-hq.jpg'
            --exclude 'assets/mesa/hera-planum/*.sd7'
            --exclude 'assets/mesa/hera-planum/_sd7/'
          )

          # RTSVR6: also drop UE lightmap bake (1v1 GLB is the match default).
          RTS_EXCLUDES=(
            "${HEAVY_EXCLUDES[@]}"
            --exclude 'assets/terrain/terrain-skirmish-ue-lm.glb'
          )

          # BattleVR2: keep ue-lm, HDR skybox, and Canyon map pack (splat + terrain-canyon).
          BATTLEVR2_EXCLUDES=(
            "${HEAVY_EXCLUDES[@]}"
          )

          for name in "${ALLOW[@]}"; do
            src="webxr/$name"
            if [[ -d "$src" ]]; then
              echo "include $src"
              extra=()
              if [[ "$name" == RTSVR6 || "$name" == RTSVR5 ]]; then
                extra=( "${RTS_EXCLUDES[@]}" )
              elif [[ "$name" == BattleVR2 ]]; then
                extra=( "${BATTLEVR2_EXCLUDES[@]}" )
              fi
              rsync -a \
                --exclude '.chrome*' \
                --exclude 'export/' \
                --exclude 'bench-*/' \
                --exclude 'node_modules/' \
                --exclude '.git/' \
                "${extra[@]}" \
                "$src" "$DEST/webxr/"
            fi
          done

          # Budget gate — fail the job before uploading a doomed artifact
          BYTES=$(du -sb "$DEST" | awk '{print $1}')
          MB=$((BYTES / 1024 / 1024))
          echo "Slim site size: ${MB} MB"
          if (( BYTES > 1000*1024*1024 )); then
            echo "::error::Slim site is ${MB}MB (>1000MB). Trim ALLOW list or excludes."
            du -sh "$DEST"/* "$DEST"/webxr/* 2>/dev/null | sort -hr | head -40
            exit 1
          fi
          du -sh "$DEST"/* "$DEST"/webxr/* 2>/dev/null | sort -hr | head -40 || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
