# Deploy a size-capped site. GitHub Pages hard-limits artifacts at 1GB;
# publishing all of webxr (~8GB tracked) always fails.
name: Deploy Pages (slim)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble slim site
        shell: bash
        run: |
          set -euo pipefail
          DEST=_site
          rm -rf "$DEST"
          mkdir -p "$DEST"

          # Root marketing site + small non-webxr apps
          for f in index.html style.css script.js favicon.ico CNAME .nojekyll .htaccess; do
            [[ -f "$f" ]] && cp -a "$f" "$DEST/"
          done
          for d in .well-known demo agenda AuthTest GsheetTest insights Nutri valu-pwa 4pong itium; do
            [[ -d "$d" ]] && rsync -a --exclude node_modules --exclude .git "$d" "$DEST/"
          done

          # webxr: allowlist only. Heavy A/B / PCVR / BAK trees stay in git for local use.
          # Paused on Pages (still in git): languageVR, DodgeVR1*, DodgeVR2*, DodgeVR3,
          # whiteRoomVR, brutalistVR7/8, VRrunner, body-rigged2/4echo/5echo/GD.
          mkdir -p "$DEST/webxr"
          [[ -f webxr/index.html ]] && cp -a webxr/index.html "$DEST/webxr/" || true

          ALLOW=(
            RTSVR5
            RTSVR6
            MotionGuidanceVR5
            StacksVR
            DodgeVR
            capVR
            BoltVR
            BattleVR
            VRdrift
            VRdrift2
            VRragdoll
            VRragdoll2
            brutalistVR6
            pinballVR2
            VRKnockout
            VRLeague
            HeliVR
            HeliVR2
            LiteRT
            DotminationVR
            body-rigged
            body-rigged3
            body-rigged4
            body-rigged5
            audio
          )

          # Quest/default runtime only — drop PCVR A/B kits, bake duplicates, scripts, proofs.
          RTS_EXCLUDES=(
            --exclude 'scripts/'
            --exclude 'verify-*/'
            --exclude 'proof-*/'
            --exclude '_quest-work/'
            --exclude 'assets/terrain/scifi-overview-lods.glb'
            --exclude 'assets/terrain/scifi-overview-lods-quest.glb'
            --exclude 'assets/terrain/scifi-overview-rocks.glb'
            --exclude 'assets/terrain/scifi-rts-kit-lod0.glb'
            --exclude 'assets/terrain/scifi-rts-kit-lod2.glb'
            --exclude 'assets/terrain/scifi-rts-overview.glb'
            --exclude 'assets/terrain/terrain-skirmish-ue-lm.glb'
            --exclude 'assets/terrain/terrain-skirmish-1v1-pcvr.glb'
            --exclude 'assets/terrain/*Copy*'
            --exclude 'assets/terrain/*.bak'
            --exclude 'assets/textures/**/*.exr'
            --exclude 'assets/mesa/hera-planum/detail/'
            --exclude 'assets/mesa/hera-planum/diffuse-hq.jpg'
            --exclude 'assets/mesa/hera-planum/normal-hq.jpg'
            --exclude 'assets/mesa/hera-planum/*.sd7'
            --exclude 'assets/mesa/hera-planum/_sd7/'
          )

          for name in "${ALLOW[@]}"; do
            src="webxr/$name"
            if [[ -d "$src" ]]; then
              echo "include $src"
              extra=()
              if [[ "$name" == RTSVR5 || "$name" == RTSVR6 ]]; then
                extra=( "${RTS_EXCLUDES[@]}" )
              fi
              rsync -a \
                --exclude '.chrome*' \
                --exclude 'export/' \
                --exclude 'bench-*/' \
                --exclude 'node_modules/' \
                --exclude '.git/' \
                "${extra[@]}" \
                "$src" "$DEST/webxr/"
            fi
          done

          # Budget gate — fail the job before uploading a doomed artifact
          BYTES=$(du -sb "$DEST" | awk '{print $1}')
          MB=$((BYTES / 1024 / 1024))
          echo "Slim site size: ${MB} MB"
          if (( BYTES > 980*1024*1024 )); then
            echo "::error::Slim site is ${MB}MB (>980MB). Trim ALLOW list or RTS_EXCLUDES."
            du -sh "$DEST"/* "$DEST"/webxr/* 2>/dev/null | sort -hr | head -40
            exit 1
          fi
          du -sh "$DEST"/* "$DEST"/webxr/* 2>/dev/null | sort -hr | head -40 || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
