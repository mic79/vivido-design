# Deploy a size-capped site. GitHub Pages hard-limits artifacts at 1GB;
# publishing all of webxr (~8GB tracked) always fails.
name: Deploy Pages (slim)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble slim site
        shell: bash
        run: |
          set -euo pipefail
          DEST=_site
          rm -rf "$DEST"
          mkdir -p "$DEST"

          # Root marketing site + small non-webxr apps
          for f in index.html style.css script.js favicon.ico CNAME .nojekyll .htaccess; do
            [[ -f "$f" ]] && cp -a "$f" "$DEST/"
          done
          for d in .well-known demo agenda AuthTest GsheetTest insights Nutri valu-pwa 4pong itium; do
            [[ -d "$d" ]] && rsync -a --exclude node_modules --exclude .git "$d" "$DEST/"
          done

          # webxr allowlist. Still offline (huge / BAK): DriveVR*, VRscifiHallway,
          # ChaseVR, GTAVR, RTSVR5, *BAK*, whiteRoomVR, VRrunner, brutalistVR7/8.
          mkdir -p "$DEST/webxr"
          [[ -f webxr/index.html ]] && cp -a webxr/index.html "$DEST/webxr/" || true

          ALLOW=(
            languageVR
            BattleVR2
            RTSVR6
            StacksVR
            DodgeVR
            DodgeVR1
            DodgeVR1-1
            DodgeVR2
            DodgeVR2v2
            DodgeVR3
            capVR
            BoltVR
            BattleVR
            MotionGuidanceVR5
            VRdrift
            VRdrift2
            VRragdoll
            VRragdoll2
            brutalistVR6
            pinballVR2
            VRKnockout
            VRLeague
            HeliVR
            HeliVR2
            LiteRT
            DotminationVR
            body-rigged
            body-rigged3
            body-rigged4
            body-rigged5
            audio
          )

          # Fat A/B cuts for RTS-family trees (PCVR kits / HQ JPEG dupes / proofs).
          HEAVY_EXCLUDES=(
            --exclude 'scripts/'
            --exclude 'verify-*/'
            --exclude 'proof-*/'
            --exclude '_quest-work/'
            --exclude 'bench-out/'
            --exclude 'assets/terrain/scifi-overview-lods.glb'
            --exclude 'assets/terrain/scifi-overview-lods-quest.glb'
            --exclude 'assets/terrain/scifi-overview-rocks.glb'
            --exclude 'assets/terrain/scifi-rts-kit-lod0.glb'
            --exclude 'assets/terrain/scifi-rts-kit-lod2.glb'
            --exclude 'assets/terrain/scifi-rts-overview.glb'
            --exclude 'assets/terrain/terrain-skirmish-1v1-pcvr.glb'
            --exclude 'assets/terrain/*Copy*'
            --exclude 'assets/terrain/*.bak'
            --exclude 'assets/textures/**/*.exr'
            --exclude 'assets/mesa/hera-planum/detail/'
            --exclude 'assets/mesa/hera-planum/diffuse-hq.jpg'
            --exclude 'assets/mesa/hera-planum/normal-hq.jpg'
            --exclude 'assets/mesa/hera-planum/*.sd7'
            --exclude 'assets/mesa/hera-planum/_sd7/'
          )

          RTS_EXCLUDES=(
            "${HEAVY_EXCLUDES[@]}"
            --exclude 'assets/terrain/terrain-skirmish-ue-lm.glb'
          )

          BATTLEVR2_EXCLUDES=(
            "${HEAVY_EXCLUDES[@]}"
          )

          for name in "${ALLOW[@]}"; do
            src="webxr/$name"
            if [[ -d "$src" ]]; then
              echo "include $src"
              extra=()
              if [[ "$name" == RTSVR6 || "$name" == RTSVR5 ]]; then
                extra=( "${RTS_EXCLUDES[@]}" )
              elif [[ "$name" == BattleVR2 ]]; then
                extra=( "${BATTLEVR2_EXCLUDES[@]}" )
              fi
              rsync -a \
                --exclude '.chrome*' \
                --exclude 'export/' \
                --exclude 'bench-*/' \
                --exclude 'node_modules/' \
                --exclude '.git/' \
                "${extra[@]}" \
                "$src" "$DEST/webxr/"
            fi
          done

          # BattleVR2 + RTSVR6 share ~300MB of identical assets. Pages tar uses
          # --hard-dereference so hardlinks/symlinks still double-count. Drop the
          # duplicate bytes from RTSVR6 and rewrite those paths to ../BattleVR2/.
          python3 - <<'PY'
          import filecmp, os, sys
          bvr = "_site/webxr/BattleVR2"
          rts = "_site/webxr/RTSVR6"
          if not (os.path.isdir(bvr) and os.path.isdir(rts)):
              print("skip dedupe: BattleVR2/RTSVR6 missing")
              sys.exit(0)
          deleted = []
          saved = 0
          for root, _dirs, files in os.walk(os.path.join(rts, "assets")):
              for name in files:
                  rp = os.path.join(root, name)
                  rel = os.path.relpath(rp, rts).replace("\\", "/")
                  bp = os.path.join(bvr, rel)
                  if os.path.isfile(bp) and filecmp.cmp(rp, bp, shallow=False):
                      saved += os.path.getsize(rp)
                      os.remove(rp)
                      deleted.append(rel)
          print(f"RTSVR6 dedupe: removed {len(deleted)} identical files ({saved/1024/1024:.1f} MB)")
          if not deleted:
              sys.exit(0)
          # Longest paths first so nested prefixes rewrite safely
          deleted.sort(key=len, reverse=True)
          text_ext = {".js", ".mjs", ".html", ".htm", ".css", ".json"}
          rewrites = 0
          for root, _dirs, files in os.walk(rts):
              for name in files:
                  ext = os.path.splitext(name)[1].lower()
                  if ext not in text_ext:
                      continue
                  path = os.path.join(root, name)
                  with open(path, "r", encoding="utf-8", errors="ignore") as f:
                      text = f.read()
                  orig = text
                  for rel in deleted:
                      repl = "../BattleVR2/" + rel
                      text = text.replace("'" + rel + "'", "'" + repl + "'")
                      text = text.replace('"' + rel + '"', '"' + repl + '"')
                      text = text.replace("`" + rel + "`", "`" + repl + "`")
                      # bare assets/... strings without webxr prefix already in rel
                  if text != orig:
                      with open(path, "w", encoding="utf-8", newline="\n") as f:
                          f.write(text)
                      rewrites += 1
          print(f"RTSVR6 dedupe: rewrote refs in {rewrites} text files")
          PY

          # Budget gate — fail before uploading a doomed artifact
          BYTES=$(du -sb "$DEST" | awk '{print $1}')
          MB=$((BYTES / 1024 / 1024))
          echo "Slim site size: ${MB} MB"
          if (( BYTES > 1000*1024*1024 )); then
            echo "::error::Slim site is ${MB}MB (>1000MB). Trim ALLOW list or excludes."
            du -sh "$DEST"/* "$DEST"/webxr/* 2>/dev/null | sort -hr | head -40
            exit 1
          fi
          du -sh "$DEST"/* "$DEST"/webxr/* 2>/dev/null | sort -hr | head -40 || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
