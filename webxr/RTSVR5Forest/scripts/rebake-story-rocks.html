<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Rebake Story rocks+terrain scenery + depth occluders</title>
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/build/three.module.js",
      "three/addons/": "/vendor/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <pre id="log">starting…</pre>
  <script type="module">
    const logEl = document.getElementById('log');
    const log = (...a) => {
      const line = a.map((x) => (typeof x === 'string' ? x : JSON.stringify(x))).join(' ');
      console.log('[rebake-rocks]', line);
      logEl.textContent += '\n' + line;
    };

    try {
      const THREE = await import('three');
      const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
      const { DRACOLoader } = await import('three/addons/loaders/DRACOLoader.js');
      const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js');

      function dequantizeAttr(attr) {
        if (!attr) return null;
        const f = new Float32Array(attr.count * attr.itemSize);
        for (let i = 0; i < attr.count; i++) {
          for (let c = 0; c < attr.itemSize; c++) {
            f[i * attr.itemSize + c] = attr.getComponent(i, c);
          }
        }
        return new THREE.BufferAttribute(f, attr.itemSize);
      }

      // Natural scenery only — no modular buildings / props (those become depth boxes).
      // Water kept so runtime can snap vertical origin to the original water sheet.
      const KEEP = /SM_Rock|SM_Dirt|SM_Cliff|SM_Mineral|SM_WaterPlane/i;

      const loader = new GLTFLoader();
      const draco = new DRACOLoader();
      draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
      loader.setDRACOLoader(draco);

      const src = '../assets/terrain/scifi-rts-kit-lod2.glb';
      log('fetch', src);
      const buf = await (await fetch(src)).arrayBuffer();
      log('bytes', buf.byteLength);
      const gltf = await loader.parseAsync(buf, '');
      const scene = (gltf.scenes || []).find((s) => /LOD2/i.test(s.name || '')) || gltf.scene;
      scene.updateMatrixWorld(true);

      const root = new THREE.Group();
      root.name = 'StoryRocksTerrain';
      const kept = [];
      const matSeen = new Map();
      const prefixCount = {};
      const tmpBox = new THREE.Box3();
      const tmpSize = new THREE.Vector3();
      const tmpCenter = new THREE.Vector3();
      const occMat = new THREE.MeshBasicMaterial({
        color: 0x000000,
        name: 'rts-depth-occluder',
      });
      let occBoxes = 0;
      const occSeen = new Set();
      // Merge all AABB boxes into ONE mesh (InstancedMesh/unique BoxGeometry
      // exploded the GLB to ~30MB; merged floats stay small).
      const unitBox = new THREE.BoxGeometry(1, 1, 1);
      const unitPos = unitBox.attributes.position;
      const unitIdx = unitBox.index;
      const mergedPos = [];
      const mergedIdx = [];
      let vertBase = 0;
      const v = new THREE.Vector3();
      const m4 = new THREE.Matrix4();
      const quat = new THREE.Quaternion();

      scene.traverse((obj) => {
        if (!obj.isMesh && !obj.isSkinnedMesh) return;
        let actor = obj;
        let actorName = obj.name || '';
        while (actor && actor !== scene) {
          if (actor.name && /SM_/i.test(actor.name)) {
            actorName = actor.name;
            break;
          }
          actor = actor.parent;
        }

        if (KEEP.test(actorName)) {
          const pref = (actorName.match(/^(SM_[A-Za-z]+)/) || ['', actorName])[1];
          prefixCount[pref] = (prefixCount[pref] || 0) + 1;

          const srcGeo = obj.geometry;
          const geo = new THREE.BufferGeometry();
          if (srcGeo.index) geo.setIndex(srcGeo.index.clone());
          if (srcGeo.attributes.position) {
            geo.setAttribute('position', dequantizeAttr(srcGeo.attributes.position));
          }
          if (srcGeo.attributes.normal) {
            geo.setAttribute('normal', dequantizeAttr(srcGeo.attributes.normal));
          } else {
            geo.computeVertexNormals();
          }
          if (srcGeo.attributes.uv) {
            geo.setAttribute('uv', dequantizeAttr(srcGeo.attributes.uv));
          }
          geo.computeBoundingSphere();
          geo.computeBoundingBox();

          let mat;
          const srcMat = Array.isArray(obj.material) ? obj.material[0] : obj.material;
          const mk = srcMat && (srcMat.uuid || srcMat.name);
          if (mk && matSeen.has(mk)) mat = matSeen.get(mk);
          else {
            mat = srcMat ? srcMat.clone() : new THREE.MeshStandardMaterial({ color: 0x888888 });
            if (mk) matSeen.set(mk, mat);
          }

          const mesh = new THREE.Mesh(geo, mat);
          mesh.name = actorName;
          const wp = new THREE.Vector3();
          const wq = new THREE.Quaternion();
          const ws = new THREE.Vector3();
          obj.getWorldPosition(wp);
          obj.getWorldQuaternion(wq);
          obj.getWorldScale(ws);
          const holder = new THREE.Group();
          holder.name = actorName;
          holder.position.copy(wp);
          holder.quaternion.copy(wq);
          holder.scale.copy(ws);
          holder.add(mesh);
          root.add(holder);
          kept.push(actorName);
          return;
        }

        if (!obj.geometry) return;
        const key = obj.uuid;
        if (occSeen.has(key)) return;
        occSeen.add(key);
        tmpBox.setFromObject(obj);
        if (tmpBox.isEmpty()) return;
        tmpBox.getSize(tmpSize);
        tmpBox.getCenter(tmpCenter);
        if (tmpSize.x < 0.05 || tmpSize.y < 0.05 || tmpSize.z < 0.05) return;
        const sx = Math.max(0.05, tmpSize.x * 0.92);
        const sy = Math.max(0.05, tmpSize.y * 0.92);
        const sz = Math.max(0.05, tmpSize.z * 0.92);
        m4.compose(tmpCenter, quat, tmpSize.set(sx, sy, sz));
        for (let i = 0; i < unitPos.count; i++) {
          v.fromBufferAttribute(unitPos, i).applyMatrix4(m4);
          mergedPos.push(v.x, v.y, v.z);
        }
        for (let i = 0; i < unitIdx.count; i++) {
          mergedIdx.push(vertBase + unitIdx.getX(i));
        }
        vertBase += unitPos.count;
        occBoxes++;
      });

      if (occBoxes > 0 && mergedPos.length) {
        const occGeo = new THREE.BufferGeometry();
        occGeo.setAttribute('position', new THREE.Float32BufferAttribute(mergedPos, 3));
        occGeo.setIndex(mergedIdx);
        occGeo.computeBoundingSphere();
        const occMesh = new THREE.Mesh(occGeo, occMat);
        occMesh.name = 'rtsOcc_merged';
        occMesh.userData.rtsDepthOccluder = true;
        root.add(occMesh);
      }

      log('kept', kept.length, prefixCount, 'occluderBoxes', occBoxes);
      if (!kept.length) throw new Error('no rock/terrain meshes');
      if (!occBoxes) throw new Error('no depth occluder boxes (unexpected)');

      const exporter = new GLTFExporter();
      const ab = await exporter.parseAsync(root, {
        binary: true,
        onlyVisible: true,
        truncateDrawRange: true,
        embedImages: true,
      });
      const bytes = ab instanceof ArrayBuffer
        ? new Uint8Array(ab)
        : new Uint8Array(ab.buffer, ab.byteOffset, ab.byteLength);

      let s = '';
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        s += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + chunk, bytes.length)));
      }
      window.__rebakeResult = {
        b64: btoa(s),
        kept: kept.length,
        bytes: bytes.length,
        mats: matSeen.size,
        occluderBoxes: occBoxes,
        prefixCount,
      };
      log('done', bytes.length, 'mats', matSeen.size, 'occ', occBoxes);
    } catch (err) {
      console.error(err);
      window.__rebakeError = String(err && err.stack ? err.stack : err);
      log('ERROR', window.__rebakeError);
    }
  </script>
</body>
</html>
