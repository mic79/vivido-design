<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calibration Halls</title>
<style>
  :root {
    --text: #f3f6f6; --muted: rgba(235,242,243,.62); --line: rgba(255,255,255,.16);
    --glass: rgba(14,18,21,.55); --accent: #8ec8ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0e10; color: var(--text);
    font-family: "Segoe UI Variable Display", "Segoe UI", "SF Pro Display", system-ui, sans-serif; overflow: hidden; }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  button { font: inherit; color: inherit; }

  /* ---------------------------------------------------------------- home */
  #home {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    display: grid; grid-template-rows: auto 1fr auto; padding: 34px 44px 30px;
    background:
      linear-gradient(90deg, rgba(8,10,12,.78) 0%, rgba(8,10,12,.45) 34%, rgba(8,10,12,0) 62%),
      linear-gradient(0deg, rgba(8,10,12,.82) 0%, rgba(8,10,12,0) 34%);
    transition: opacity .6s ease;
  }
  #home.hide { opacity: 0; visibility: hidden; transition: opacity .4s ease, visibility 0s .4s; }
  #home > * { pointer-events: auto; }
  .top { display: flex; align-items: center; gap: 18px; }
  .brand { font-size: 13px; letter-spacing: .42em; font-weight: 600; color: rgba(255,255,255,.86); }
  .brand small { display: block; letter-spacing: .18em; font-weight: 400; color: var(--muted); margin-top: 4px; font-size: 11px; }
  .top .spacer { flex: 1; }
  .toggle {
    display: inline-flex; align-items: center; gap: 9px; padding: 8px 14px 8px 10px; border-radius: 99px;
    border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(10px); cursor: pointer;
    font-size: 13px; color: var(--muted); user-select: none;
  }
  .toggle input { display: none; }
  .toggle i { width: 30px; height: 18px; border-radius: 9px; background: rgba(255,255,255,.18); position: relative; transition: background .2s; }
  .toggle i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .toggle input:checked + i { background: var(--accent); }
  .toggle input:checked + i::after { transform: translateX(12px); }
  .toggle:has(input:checked) { color: var(--text); }
  #stylePicker {
    display: inline-flex; padding: 3px; border-radius: 99px; border: 1px solid var(--line);
    background: var(--glass); backdrop-filter: blur(10px); gap: 2px;
  }
  #stylePicker .style-opt {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    padding: 7px 14px; border-radius: 99px; font-size: 13px; font-weight: 600;
  }
  #stylePicker .style-opt.on { background: rgba(255,255,255,.14); color: var(--text); }
  #stylePicker .style-opt:hover:not(.on) { color: var(--text); }
  #btnResearch { padding: 8px 14px; border-radius: 99px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; }
  #btnResearch:hover { color: var(--text); border-color: rgba(255,255,255,.4); }

  .hero { align-self: center; max-width: 560px; }
  .over { font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .hero h1 { font-weight: 300; font-size: clamp(44px, 6vw, 82px); line-height: 1.02; margin: 14px 0 16px; letter-spacing: -.01em; }
  .hero p { font-size: 18px; line-height: 1.5; color: rgba(240,245,246,.82); margin: 0 0 18px; max-width: 470px; }
  .chips { display: flex; gap: 8px; margin-bottom: 30px; flex-wrap: wrap; }
  .chip { padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); font-size: 13px; color: var(--muted); background: var(--glass); backdrop-filter: blur(6px); }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .btn-primary {
    padding: 17px 34px; border-radius: 99px; border: 0; cursor: pointer; font-size: 17px; font-weight: 600;
    background: var(--accent); color: #0b1013; letter-spacing: .02em;
    box-shadow: 0 10px 40px -8px color-mix(in srgb, var(--accent) 70%, transparent);
    transition: transform .15s ease, filter .15s;
  }
  .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.08); }
  .btn-primary:disabled { opacity: .45; cursor: default; transform: none; }
  .btn-ghost {
    padding: 16px 26px; border-radius: 99px; border: 1px solid rgba(255,255,255,.3); background: var(--glass);
    backdrop-filter: blur(10px); cursor: pointer; font-size: 16px; color: var(--text);
  }
  .btn-ghost:hover { border-color: rgba(255,255,255,.6); }
  .btn-ghost:disabled { opacity: .45; cursor: default; }
  .hint { margin-top: 16px; font-size: 13px; color: var(--muted); }

  /* room rail */
  #rail { display: grid; grid-template-columns: 3fr 5fr 4fr 2fr; gap: 18px; }
  .chap h3 { margin: 0 0 9px; font-size: 11px; letter-spacing: .26em; font-weight: 600; color: var(--muted); text-transform: uppercase; display: flex; justify-content: space-between; }
  .chap h3 span { letter-spacing: .05em; opacity: .7; }
  .tiles { display: flex; gap: 6px; }
  .tile {
    flex: 1; min-width: 0; height: 64px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass);
    backdrop-filter: blur(10px); cursor: pointer; padding: 8px 9px; text-align: left; position: relative; overflow: hidden;
    transition: border-color .15s, background .15s, transform .15s;
  }
  .tile:hover { border-color: rgba(255,255,255,.45); transform: translateY(-2px); }
  .tile .n { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .08em; }
  .tile .nm { font-size: 12.5px; line-height: 1.2; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c); opacity: .9; }
  .tile.done::after { content: "✓"; position: absolute; right: 8px; top: 6px; font-size: 13px; color: var(--c); font-weight: 700; }
  .tile.sel { border-color: var(--c); background: color-mix(in srgb, var(--c) 18%, rgba(14,18,21,.6)); }

  /* --------------------------------------------------------- research */
  #drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 92vw); z-index: 5;
    background: rgba(10,14,16,.96); border-left: 1px solid var(--line); backdrop-filter: blur(12px);
    transform: translateX(100%); transition: transform .35s ease; display: flex; flex-direction: column;
    padding: 22px 22px 16px; gap: 10px; overflow: auto; font-size: 13px;
  }
  #drawer.open { transform: none; }
  #drawer h2 { margin: 6px 0 2px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  #drawer .row { display: flex; gap: 8px; align-items: center; }
  #drawer input, #drawer select { width: 100%; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: #0d1417; color: var(--text); font-size: 13px; }
  #testDesc { padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,.04); border: 1px solid var(--line); line-height: 1.5; color: #c6d7da; }
  button.tiny { padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; font-size: 12px; }
  button.tiny.danger { color: #f0a0a0; border-color: rgba(240,120,120,.35); }
  .btnrow { display: flex; gap: 6px; flex-wrap: wrap; }
  #sessions { max-height: 200px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: #0d1417; }
  #sessions:empty::after { content: "No saved sessions yet."; display: block; padding: 10px; color: var(--muted); }
  .sess { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,.07); align-items: center; }
  .sess .meta { color: var(--muted); font-size: 11px; }
  .sess.on { background: rgba(255,255,255,.06); }
  #plotWrap { height: 260px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: #0a1012; overflow: hidden; }
  #plot { display: block; width: 100%; height: 100%; }
  #summary { border-radius: 12px; border: 1px solid var(--line); padding: 10px 12px; line-height: 1.55; color: #b7d4d8; }
  #summary:empty { display: none; }
  #status { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 3; font-size: 11px; color: rgba(255,255,255,.35); pointer-events: none; }
  #home:not(.hide) ~ #status { display: none; }
  @media (max-width: 900px) {
    #rail { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #home { padding: 22px; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="home">
  <div class="top">
    <div class="brand">CALIBRATION HALLS<small>Fourteen rooms · about ten minutes</small></div>
    <div class="spacer"></div>
    <div id="stylePicker" title="Hall style"></div>
    <label class="toggle"><input id="musicOn" type="checkbox" checked><i></i>Music</label>
    <label class="toggle"><input id="voiceOn" type="checkbox" checked><i></i>Voice</label>
    <button id="btnResearch" title="Researcher tools">Research</button>
  </div>

  <div class="hero">
    <div class="over" id="heroOver">Chapter I · Stillness &amp; Glide</div>
    <h1 id="heroTitle">Still Stance</h1>
    <p id="heroBrief"></p>
    <div class="chips" id="heroChips"></div>
    <div class="actions">
      <button class="btn-primary" id="go" disabled>Loading…</button>
      <button class="btn-ghost" id="goFlat" disabled>Play on screen</button>
    </div>
    <div class="hint" id="heroHint">Put on your headset, then press Enter VR. You can jump to any room below.</div>
  </div>

  <div id="rail"></div>
</div>

<aside id="drawer">
  <div class="row" style="justify-content:space-between">
    <h2 style="margin:0">Researcher tools</h2>
    <button class="tiny" id="btnCloseDrawer">Close</button>
  </div>
  <h2>Participant id</h2>
  <input id="pid" type="text" placeholder="P001" autocomplete="off">
  <h2>Room</h2>
  <select id="test"></select>
  <div id="testDesc"></div>
  <div class="btnrow"><button class="tiny" id="btnResetProgress">Reset progress</button></div>
  <h2>Saved sessions</h2>
  <div id="sessions"></div>
  <div class="btnrow">
    <button class="tiny" id="btnExport">Export selected</button>
    <button class="tiny" id="btnExportAll">Export all</button>
    <button class="tiny danger" id="btnClear">Clear all</button>
  </div>
  <div id="plotWrap"><canvas id="plot"></canvas></div>
  <div id="summary"></div>
</aside>

<div id="status">Calibration Halls</div>

<script type="importmap">
{
  "imports": {
    "three": "./lib/three.module.js",
    "three/addons/": "./lib/addons/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
