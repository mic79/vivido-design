      #mobile-rotate-prompt {

      flex-direction: column; align-items: center; justify-content: center;

  <body>
  <!-- Pre-VR nickname overlay (DodgeVR-style) -->
  <div id="pre-vr-overlay">
    <div>
      <h1>STACKS VR</h1>
      <p class="tagline">1v1 Block Stacking in Virtual Reality</p>
      <label for="nickname-input">Nickname</label>
      <input id="nickname-input" type="text" maxlength="12" placeholder="Player" autocomplete="username" />
      <div class="pre-vr-actions">
        <button type="button" id="pre-vr-spectate-btn">Spectate (flatscreen)</button>
        <p class="spectate-hint">Same Watch / Offline Preview as mobile — orbit with mouse drag. VR play still uses Enter VR below.</p>
      </div>
      <p class="hint">Headset ready? Press <b>Enter VR</b> below to play</p>
    </div>
  </div>
  <div id="app-version-chip" aria-hidden="true"></div>
  <script>
    (function () {
      var chip = document.getElementById('app-version-chip');
      if (chip) chip.textContent = 'v' + (window.STACKS_VERSION || '0.0.0');
    })();
  </script>
  <script>
    (function () {
      var input = document.getElementById('nickname-input');
      if (!input) return;
      var saved = localStorage.getItem('stacksvr-nickname');
      if (saved) input.value = saved;
      function syncNick() {
        var v = (input.value || '').trim().slice(0, 12);
        localStorage.setItem('stacksvr-nickname', v);
        window.playerNickname = v || 'Player';
      }
      input.addEventListener('input', syncNick);
      window.playerNickname = (saved && saved.trim()) ? saved.trim().slice(0, 12) : 'Player';
    })();
  </script>

  <script>
    (function () {
      function hidePreVr() {
        var overlay = document.getElementById('pre-vr-overlay');
        if (overlay) overlay.classList.add('gone');
      }
      // Idle spectacle: two bots play until you START vs BOT / join queue match
      function startDualIdle() {
        hidePreVr();
        if (window.isMobileSpectator) return;
        // Host WAITING lobby still gets dual bots; only skip during a real PLAYING match
        if (window.lobbyState && window.lobbyState.matchState === 'PLAYING') return;
        var el = document.querySelector('[stacks-game]');
        var g = el && el.components && el.components['stacks-game'];
        if (g && !g.matchActive && typeof g.startOfflinePreviewMatch === 'function') {
          g.startOfflinePreviewMatch();
        }
      }
      document.querySelector('a-scene').addEventListener('enter-vr', startDualIdle);

      // Mobile spectator UI/UX is handled by mobile-spectator.js (DodgeVR port).
      // Desktop / VR keyboard helpers only:
      window.addEventListener('keydown', function (e) {
        if (window.isMobileSpectator) return;
        if (e.key === 'b' || e.key === 'B') {
          var el = document.querySelector('[stacks-game]');
          var g = el && el.components && el.components['stacks-game'];
          if (g && !g.matchActive) g.startOfflineBotMatch();
        }
        if (e.key === 'm' || e.key === 'M') {
          var menu = document.querySelector('[vr-menu]');
          if (menu && menu.components['vr-menu']) menu.components['vr-menu'].toggleMenu();
        }
      });
    })();
  </script>
